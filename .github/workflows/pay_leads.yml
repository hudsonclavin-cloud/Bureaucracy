# Bring the owner the posts a held pay document prints under another filing.
#
# No AI, no secrets, no network beyond GitHub itself. It runs scripts/find_pay_leads.py,
# which reads the committed graph and the committed Plum Book export and lists, per
# unpriced post, every organisation of the post's own agency that prints its title.
# The result is ONE open issue, rewritten each run, so the owner is notified by the
# ordinary issue mechanism: no pull request, so the "Allow GitHub Actions to create and
# approve pull requests" setting is not needed here. Nothing is committed or pushed.
#
# Start it: Actions > "pay leads" > Run workflow. It also runs on the 17th of each month,
# the day after the update cycle's pull request opens.
name: pay leads

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 17 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: pay-leads
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the leads
        run: |
          python scripts/find_pay_leads.py --dry-run > leads_full.txt
          head -n 1 leads_full.txt | tee leads_summary.txt
          python scripts/find_pay_leads.py --issue-body > issue_body.md
          wc -c issue_body.md

      - name: Keep one issue open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="Pay leads awaiting the owner"
          gh label create pay-leads --color 0E8A16 --description "Posts a held pay document prints under another filing" 2>/dev/null || true
          N=$(gh issue list --label pay-leads --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" --title "$TITLE" --body-file issue_body.md
            echo "updated issue #$N"
          else
            gh issue create --title "$TITLE" --label pay-leads --body-file issue_body.md
          fi

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-leads
          path: |
            leads_summary.txt
            issue_body.md
